services:
  # AgentOS API Server
  agentos:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      AGENTOS_ADDRESS: ${AGENTOS_ADDRESS:-:8080}
      AGENTOS_DEBUG: ${AGENTOS_DEBUG:-false}
      AGENTOS_PREFIX: ${AGENTOS_PREFIX:-}
      AGENTOS_ALLOW_ORIGINS: ${AGENTOS_ALLOW_ORIGINS:-}

      # Knowledge API is opt-in in the base stack. Use docker-compose.knowledge.yml
      # for the Chroma/OpenAI-enabled profile.
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-false}
      CHROMA_URL: ${CHROMA_URL:-http://chromadb:8000}
      CHROMA_TENANT: ${CHROMA_TENANT:-default_tenant}
      CHROMA_DATABASE: ${CHROMA_DATABASE:-default_database}
      KNOWLEDGE_COLLECTION: ${KNOWLEDGE_COLLECTION:-hno_knowledge}
      KNOWLEDGE_HEALTH_ENABLED: ${KNOWLEDGE_HEALTH_ENABLED:-true}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Optional persistent AgentOS session storage
      AGENTOS_SESSION_DSN: ${AGENTOS_SESSION_DSN:-postgres://agno:agno_password@postgres:5432/agentos?sslmode=disable}
      AGENTOS_SESSION_SCHEMA: ${AGENTOS_SESSION_SCHEMA:-public}
      AGENTOS_SESSION_TABLE: ${AGENTOS_SESSION_TABLE:-agno_agentos_sessions}

      # Optional model provider variables used by other integrations
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agno-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # PostgreSQL Database (for persistent session storage)
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=agno
      - POSTGRES_PASSWORD=agno_password
      - POSTGRES_DB=agentos
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./scripts/migrations/001_agentos_sessions.sql:/docker-entrypoint-initdb.d/001_agentos_sessions.sql:ro
    restart: unless-stopped
    networks:
      - agno-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agno"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama (optional - for local LLM models)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - agno-network
    profiles:
      - with-ollama

  # ChromaDB (optional - for vector storage)
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - agno-network
    profiles:
      - with-vectordb

volumes:
  postgres-data:
    driver: local
  ollama-data:
    driver: local
  chromadb-data:
    driver: local

networks:
  agno-network:
    driver: bridge

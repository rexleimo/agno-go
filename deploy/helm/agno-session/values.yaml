replicaCount: 1

image:
  repository: ghcr.io/example/agno-session
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

config:
  # Prefer existingSecret in production. config.dsn remains a local-development fallback.
  existingSecret: ""
  dsnKey: AGNO_PG_DSN
  dsn: ""

migrations:
  enabled: true
  image: postgres:16-alpine

env: []

livenessProbe:
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10
